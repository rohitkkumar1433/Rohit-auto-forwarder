<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROHIT AUTO FORWARDER</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>ROHIT AUTO FORWARDER</h1><p class="sub">Website control panel starter</p>
<section><h2>Forwarding mode</h2><label><input type="radio" name="mode" value="forward" checked> Original forward</label><label><input type="radio" name="mode" value="copy"> Copy without forwarded label</label></section>
<section><h2>Delay</h2><input id="delay" type="number" min="1" value="60"> seconds</section>
<section class="actions"><button id="start">Start</button><button id="stop" class="secondary">Stop</button></section>
<p id="status">Status: Not connected (starter demo)</p><p class="note">This page is a UI demo. Connect it to a secured backend before use.</p></main><script src="script.js"></script></body></html>
